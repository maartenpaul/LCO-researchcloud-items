---
# pixi-ai-tools.yml — SURF Research Cloud component entry point.
#
# Installs Pixi and deploys AI/ML tool environments for bioimage analysis.
# All logic lives in roles/pixi_ai_tools; see its README for details.
#
# SRC Parameters. Declared in the component wizard; SRC passes each one to this
# playbook as an Ansible variable named after its key. The role also accepts the
# same names as environment variables, which is only meant for testing outside
# SRC.
#   PIXI_AI_TOOLS_VERSION  — Git branch/tag to clone (default: "master")
#   PIXI_AI_TOOLS_PRELOAD  — Tools to pre-install, or "all" (default: "all")
#   PIXI_AI_TOOLS_DESKTOP  — Install the remote desktop for GUI tools such as
#                            napari (default: false). Adds roughly 200 packages
#                            and about a gigabyte, so leave it off unless the
#                            workspace needs a GUI. Install-only: setting it
#                            back to false skips the phase but does not remove
#                            a desktop already installed — redeploy from
#                            scratch for that.
#
# Uses the uusrc.general Ansible collection (see requirements.yml).

- name: Install Pixi AI Tools
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - pixi_ai_tools
