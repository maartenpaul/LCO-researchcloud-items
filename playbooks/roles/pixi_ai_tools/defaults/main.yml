---
# SRC parameters. SRC passes each component parameter to the playbook as an
# Ansible variable named after its key. The env lookup is only a fallback for
# driving the role from a shell when testing outside SRC.
pixi_ai_tools_version: >-
  {{ PIXI_AI_TOOLS_VERSION | default(lookup('env', 'PIXI_AI_TOOLS_VERSION'), true)
     | default('master', true) }}

# Comma-separated tools to build in /opt, or "all". Only these get a kernel, a
# menu entry and a copy in each user's ~/AI_tools_pixi.
pixi_ai_tools_preload: >-
  {{ PIXI_AI_TOOLS_PRELOAD | default(lookup('env', 'PIXI_AI_TOOLS_PRELOAD'), true)
     | default('all', true) }}

# XFCE + noVNC behind JupyterLab's "Desktop" tile, for the JupyterHub flavour.
# ~200 packages; install-only (setting it back to false does not remove it).
pixi_ai_tools_desktop: >-
  {{ PIXI_AI_TOOLS_DESKTOP | default(lookup('env', 'PIXI_AI_TOOLS_DESKTOP'), true)
     | default(false, true) }}

# Pinned so two workspaces built from the same component get the same pixi.
# "latest" only installs pixi where it is missing.
pixi_ai_tools_pixi_version: >-
  {{ PIXI_AI_TOOLS_PIXI_VERSION | default(lookup('env', 'PIXI_AI_TOOLS_PIXI_VERSION'), true)
     | default('0.78.0', true) }}

pixi_ai_tools_home: /usr/local
pixi_ai_tools_bin: /usr/local/bin/pixi
pixi_ai_tools_repo_url: https://github.com/Leiden-Cell-Observatory/AI_tools_pixi.git
pixi_ai_tools_shared_dir: /opt/AI_tools_pixi
pixi_ai_tools_cache_dir: /opt/pixi-cache
# Environment holding the JupyterLab server for the desktop flavour, which has
# no Lab of its own. Not a tool: no kernel, no menu entry, no user copy.
pixi_ai_tools_lab_env: jupyterlab
pixi_ai_tools_kernel_wrapper: /usr/local/bin/ai-tools-kernel
pixi_ai_tools_icon_dir: /usr/share/icons/hicolor
pixi_ai_tools_rdp_version: "3.0.1"

# Not in the Ubuntu archive; pinned by version and checksum, bump both together.
pixi_ai_tools_virtualgl_version: "3.1.5"
pixi_ai_tools_virtualgl_sha256: df3f7788ce41b182a47c0d298e5cd6d2d63579522cb41825970b7726e825485e
pixi_ai_tools_virtualgl_deb: "virtualgl_{{ pixi_ai_tools_virtualgl_version }}_amd64.deb"
pixi_ai_tools_virtualgl_url: >-
  https://github.com/VirtualGL/virtualgl/releases/download/{{
  pixi_ai_tools_virtualgl_version }}/{{ pixi_ai_tools_virtualgl_deb }}

# Tools with a GUI, and the command that opens it. A preloaded tool listed here
# gets a menu entry and a Desktop icon; everything else is notebook-only.
pixi_ai_tools_gui_commands:
  cellpose: python -m cellpose
  CAREamics: napari
  micro_sam: napari
  nninteractive: napari
  omero: napari
  stardist: napari

# Icon per tool, from files/icons; unlisted tools get the napari icon.
pixi_ai_tools_icons_by_tool:
  cellpose: pixi-cellpose
  micro_sam: pixi-micro_sam
  omero: pixi-omero
  stardist: pixi-stardist
