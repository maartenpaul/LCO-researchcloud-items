---
# SRC parameters. A component parameter reaches an Ansible playbook as a
# variable named after its key — not as an environment variable, which is the
# PowerShell/Windows mechanism. Reading these with lookup('env', ...) alone
# silently ignored everything set in the portal and always used the defaults
# below. The env lookup is kept only as a fallback so the role can be driven
# from a shell when testing outside SRC.
pixi_ai_tools_version: >-
  {{ PIXI_AI_TOOLS_VERSION | default(lookup('env', 'PIXI_AI_TOOLS_VERSION'), true)
     | default('master', true) }}

# Comma-separated tool list to pre-install, or "all". Tools that are not
# pre-installed get no shared kernel — users cannot install into /opt.
# "all" builds every environment in the repository, which is a long deploy;
# naming just the tools a course needs keeps it short.
pixi_ai_tools_preload: >-
  {{ PIXI_AI_TOOLS_PRELOAD | default(lookup('env', 'PIXI_AI_TOOLS_PRELOAD'), true)
     | default('all', true) }}

# Off by default: the desktop costs roughly 200 packages and about a gigabyte,
# which is wasted on a workspace where nobody opens a GUI tool. Turn it on for
# courses that use napari.
#
# Install-only. Setting this back to false on a workspace that was deployed with
# it true only skips the desktop phase; it does not undo it. The kernels do
# converge — kernels.yml keys the display wrapper off this same variable and
# rewrites every kernel.json without it — so nothing breaks, but XFCE,
# VirtualGL, the menu entries, the wrappers and the Desktop tile stay, and the
# gigabyte is not reclaimed. To actually drop the desktop, redeploy the
# workspace from scratch with it off.
pixi_ai_tools_desktop: >-
  {{ PIXI_AI_TOOLS_DESKTOP | default(lookup('env', 'PIXI_AI_TOOLS_DESKTOP'), true)
     | default(false, true) }}

pixi_ai_tools_home: /usr/local
pixi_ai_tools_bin: /usr/local/bin/pixi
pixi_ai_tools_runonce_dir: /etc/runonce.d
pixi_ai_tools_repo_url: https://github.com/Leiden-Cell-Observatory/AI_tools_pixi.git
# One shared, root-owned copy of the tools + one shared package cache.
# Per-user clones would multiply 5-10 GB per env by the number of students.
pixi_ai_tools_shared_dir: /opt/AI_tools_pixi
pixi_ai_tools_cache_dir: /opt/pixi-cache
pixi_ai_tools_kernel_dir: /usr/local/share/jupyter/kernels
pixi_ai_tools_kernel_wrapper: /usr/local/bin/ai-tools-kernel
# The noVNC/XFCE session behind JupyterLab's "Desktop" tile. Pinned for the same
# reason as VirtualGL below: a redeploy should install what it installed last
# time rather than whatever upstream has released since.
pixi_ai_tools_rdp_version: "3.0.1"

# VirtualGL is not in the Ubuntu archive, so it is fetched from the project's
# own releases. Pinned by version and checksum so a redeploy of this component
# installs what it installed last time; bump both together.
pixi_ai_tools_virtualgl_version: "3.1.5"
pixi_ai_tools_virtualgl_sha256: df3f7788ce41b182a47c0d298e5cd6d2d63579522cb41825970b7726e825485e
pixi_ai_tools_virtualgl_deb: "virtualgl_{{ pixi_ai_tools_virtualgl_version }}_amd64.deb"
# The line break sits inside the Jinja expression, where the folded-scalar
# newline becomes an ignored space rather than a space in the URL.
pixi_ai_tools_virtualgl_url: >-
  https://github.com/VirtualGL/virtualgl/releases/download/{{
  pixi_ai_tools_virtualgl_version }}/{{ pixi_ai_tools_virtualgl_deb }}
