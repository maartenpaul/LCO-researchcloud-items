---
# One root-owned checkout in /opt serves every user, so N students do not each
# build their own 5-10 GB copy of every environment. The package cache is shared
# too: pixi hardlinks package files out of it, so a user who forks an environment
# to add packages pays only a fraction of its apparent size.
#
# The cache must be writable by users (pixi opens repodata read-write, and
# `pixi add` downloads new packages), but root writes it first during preload.
# A default ACL for the workspace group keeps files created by either party
# group-writable, which plain 1777 does not.

- name: Install ACL tooling
  ansible.builtin.apt:
    name: acl
    state: present

- name: Discover the primary group shared by workspace users
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      getent passwd | awk -F: '$3 >= 1000 && $3 < 65534 && $6 ~ /^\/home\//
      { print $4 }' | sort | uniq -c | sort -rn | head -1 | awk '{print $2}'
    executable: /bin/bash
  register: pixi_ai_tools_co_gid_raw
  changed_when: false

- name: Set workspace group fact
  ansible.builtin.set_fact:
    pixi_ai_tools_workspace_gid: "{{ pixi_ai_tools_co_gid_raw.stdout | trim }}"

- name: Create shared pixi cache directory
  ansible.builtin.file:
    path: "{{ pixi_ai_tools_cache_dir }}"
    state: directory
    owner: root
    group: "{{ pixi_ai_tools_workspace_gid | default(omit) }}"
    mode: "2775"

- name: Export shared pixi cache to all login shells
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^PIXI_CACHE_DIR='
    line: "PIXI_CACHE_DIR={{ pixi_ai_tools_cache_dir }}"
    create: true
    mode: "0644"

# Older pixi releases wrote lock files in a layout the current one migrates on
# sight, so a plain `pixi install` rewrote every lock it touched. Those are
# tracked files, so the checkout went dirty and the clone task below — rightly
# refusing to discard local changes — failed on every redeploy after the first,
# taking the whole play with it. The preload task now passes --locked and no
# longer rewrites anything, but workspaces built before that fix still carry the
# modifications, and would stay stuck without this.
#
# Only lock files are restored, and only where the tool's pixi.toml is itself
# untouched. A lock on its own changes because pixi rewrote it; a lock next to a
# modified manifest means somebody ran `pixi add` in the shared checkout to try a
# dependency, and their lock is real work. Restoring it would silently undo that
# and leave the manifest describing something the lock does not — which --locked
# then refuses to install. Anything else a person changed is left alone and will
# still stop the clone task, which is what force=no is for.
- name: Check whether the shared checkout is already a git repository
  ansible.builtin.stat:
    path: "{{ pixi_ai_tools_shared_dir }}/.git"
  register: pixi_ai_tools_shared_git

# noqa: command-instead-of-module — the git module manages a whole checkout;
# it cannot restore selected paths, which is the entire point here.
- name: Restore lock files that pixi rewrote  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      restored=""
      while read -r _ lock; do
          [ -n "$lock" ] || continue
          tool_dir=$(dirname "$lock")
          # A modified manifest alongside it means this is someone's own work.
          if [ -n "$(git status --porcelain -- "$tool_dir/pixi.toml")" ]; then
              echo "keeping $lock: $tool_dir/pixi.toml is modified too" >&2
              continue
          fi
          git checkout -- "$lock"
          restored="${restored} ${lock}"
      done < <(git status --porcelain -- '*/pixi.lock')
      [ -z "${restored}" ] || echo "restored:${restored}"
    executable: /bin/bash
    chdir: "{{ pixi_ai_tools_shared_dir }}"
  register: pixi_ai_tools_restored_locks
  when: pixi_ai_tools_shared_git.stat.exists
  changed_when: "'restored:' in pixi_ai_tools_restored_locks.stdout"

- name: Clone AI_tools_pixi to the shared location
  ansible.builtin.git:
    repo: "{{ pixi_ai_tools_repo_url }}"
    dest: "{{ pixi_ai_tools_shared_dir }}"
    version: "{{ pixi_ai_tools_version }}"
    depth: 1
    force: false
  become: true

# Only the repository content needs opening up; the .pixi/ environment trees
# are pixi's own and must be left alone. Recursing into them is actively
# harmful: their files are hardlinks into the shared cache, so an absolute mode
# like u=rwX,go=rX strips group-write from ~45k cache entries — undoing the
# setfacl below, which the next deploy then restores, so the two tasks fight
# over the same inodes and the task never reports "ok". Adding rX rather than
# assigning an absolute mode keeps this idempotent whatever the umask was.
- name: Make the shared checkout readable by everyone
  ansible.builtin.command:
    cmd: >-
      find {{ pixi_ai_tools_shared_dir }} -name .pixi -prune -o
      ( -type d -not -perm -go=rx -o -type f -not -perm -go=r )
      -print -exec chmod go+rX {} +
  register: pixi_ai_tools_readable
  changed_when: pixi_ai_tools_readable.stdout | length > 0

- name: Discover tools in the shared checkout
  ansible.builtin.find:
    paths: "{{ pixi_ai_tools_shared_dir }}"
    patterns: pixi.toml
    recurse: true
    depth: 2
    file_type: file
  register: pixi_ai_tools_shared_manifests

- name: Build the list of tools to pre-install
  ansible.builtin.set_fact:
    pixi_ai_tools_all_tools: >-
      {{ pixi_ai_tools_shared_manifests.files
         | map(attribute='path') | map('dirname') | map('basename') | sort }}

- name: Resolve the preload selection
  ansible.builtin.set_fact:
    pixi_ai_tools_preload_tools: >-
      {{ pixi_ai_tools_all_tools if pixi_ai_tools_preload | lower == 'all'
         else (pixi_ai_tools_preload.split(',') | map('trim') | select('in', pixi_ai_tools_all_tools) | list) }}

- name: Report preload selection
  ansible.builtin.debug:
    msg: >-
      Pre-installing shared environments: {{ pixi_ai_tools_preload_tools | join(', ') | default('(none)', true) }}.
      Available: {{ pixi_ai_tools_all_tools | join(', ') }}.
      Only pre-installed tools get a shared Jupyter kernel — users cannot write to {{ pixi_ai_tools_shared_dir }}.

# The long pole of the deploy. Runs before any student logs in.
#
# --locked installs exactly what the lock file says and refuses to rewrite it,
# which is what keeps the checkout clean for the next deploy. It also fails
# loudly if a lock has drifted from its pixi.toml, rather than silently building
# something the repository never described — the reason for preferring it over
# --frozen, which skips that check.
#
# There is deliberately no `creates:` guard. It used to skip any tool whose
# environment directory already existed, which meant a redeploy that pulled a
# changed manifest kept serving the old environment and the update quietly did
# nothing. Re-running costs ~0.1s per tool when the environment already matches
# its lock, so the guard bought nothing.
#
# pixi prints the same output whether or not it did any work, so `changed` is
# taken from conda-meta, whose contents change exactly when packages do.
#
# `set -e` is what makes the --locked failure above actually reach Ansible.
# Without it the script's exit status is the trailing `if`, which is always 0:
# a failed install would be reported as ok, and since nothing was installed
# conda-meta would be unchanged in both samples, so it would also be reported
# as unchanged. The deploy then carried on and kernels.yml registered a kernel
# for an environment that does not exist.
- name: Pre-install shared pixi environments
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      meta="{{ pixi_ai_tools_shared_dir }}/{{ item }}/.pixi/envs/default/conda-meta"
      before=$(stat -c %Y "$meta" 2>/dev/null || echo absent)
      "{{ pixi_ai_tools_bin }}" install --locked \
        --manifest-path "{{ pixi_ai_tools_shared_dir }}/{{ item }}/pixi.toml"
      after=$(stat -c %Y "$meta" 2>/dev/null || echo absent)
      if [ "$before" = "$after" ]; then echo pixi-unchanged; else echo pixi-changed; fi
    executable: /bin/bash
  environment:
    PIXI_CACHE_DIR: "{{ pixi_ai_tools_cache_dir }}"
  loop: "{{ pixi_ai_tools_preload_tools }}"
  register: pixi_ai_tools_preload
  changed_when: "'pixi-changed' in pixi_ai_tools_preload.stdout"

- name: Grant the workspace group write access to the shared cache
  ansible.builtin.command:
    cmd: >-
      setfacl -R -m g:{{ pixi_ai_tools_workspace_gid }}:rwX -m d:g:{{ pixi_ai_tools_workspace_gid }}:rwX
      {{ pixi_ai_tools_cache_dir }}
  when: pixi_ai_tools_workspace_gid | length > 0
  changed_when: true
