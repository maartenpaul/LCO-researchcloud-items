---
# One root-owned checkout in /opt serves every user, so N students do not each
# build their own 5-10 GB copy of every environment. The package cache is shared
# too: pixi hardlinks package files out of it, so a user who forks an environment
# to add packages pays only a fraction of its apparent size.
#
# The cache must be writable by users (pixi opens repodata read-write, and
# `pixi add` downloads new packages), but root writes it first during preload.
# A default ACL for the workspace group keeps files created by either party
# group-writable, which plain 1777 does not.

- name: Install ACL tooling
  ansible.builtin.apt:
    name: acl
    state: present

- name: Discover the primary group shared by workspace users
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      getent passwd | awk -F: '$3 >= 1000 && $3 < 65534 && $6 ~ /^\/home\//
      { print $4 }' | sort | uniq -c | sort -rn | head -1 | awk '{print $2}'
    executable: /bin/bash
  register: pixi_ai_tools_co_gid_raw
  changed_when: false

- name: Set workspace group fact
  ansible.builtin.set_fact:
    pixi_ai_tools_workspace_gid: "{{ pixi_ai_tools_co_gid_raw.stdout | trim }}"

- name: Create shared pixi cache directory
  ansible.builtin.file:
    path: "{{ pixi_ai_tools_cache_dir }}"
    state: directory
    owner: root
    group: "{{ pixi_ai_tools_workspace_gid | default(omit) }}"
    mode: "2775"

- name: Export shared pixi cache to all login shells
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^PIXI_CACHE_DIR='
    line: "PIXI_CACHE_DIR={{ pixi_ai_tools_cache_dir }}"
    create: true
    mode: "0644"

- name: Clone AI_tools_pixi to the shared location
  ansible.builtin.git:
    repo: "{{ pixi_ai_tools_repo_url }}"
    dest: "{{ pixi_ai_tools_shared_dir }}"
    version: "{{ pixi_ai_tools_version }}"
    depth: 1
    force: false
  become: true

- name: Make the shared checkout world-readable
  ansible.builtin.file:
    path: "{{ pixi_ai_tools_shared_dir }}"
    state: directory
    mode: "u=rwX,go=rX"
    recurse: true

- name: Discover tools in the shared checkout
  ansible.builtin.find:
    paths: "{{ pixi_ai_tools_shared_dir }}"
    patterns: pixi.toml
    recurse: true
    depth: 2
    file_type: file
  register: pixi_ai_tools_shared_manifests

- name: Build the list of tools to pre-install
  ansible.builtin.set_fact:
    pixi_ai_tools_all_tools: >-
      {{ pixi_ai_tools_shared_manifests.files
         | map(attribute='path') | map('dirname') | map('basename') | sort }}

- name: Resolve the preload selection
  ansible.builtin.set_fact:
    pixi_ai_tools_preload_tools: >-
      {{ pixi_ai_tools_all_tools if pixi_ai_tools_preload | lower == 'all'
         else (pixi_ai_tools_preload.split(',') | map('trim') | select('in', pixi_ai_tools_all_tools) | list) }}

- name: Report preload selection
  ansible.builtin.debug:
    msg: >-
      Pre-installing shared environments: {{ pixi_ai_tools_preload_tools | join(', ') | default('(none)', true) }}.
      Available: {{ pixi_ai_tools_all_tools | join(', ') }}.
      Only pre-installed tools get a shared Jupyter kernel — users cannot write to {{ pixi_ai_tools_shared_dir }}.

# The long pole of the deploy. Runs once, before any student logs in.
- name: Pre-install shared pixi environments
  ansible.builtin.command:
    cmd: "{{ pixi_ai_tools_bin }} install --manifest-path {{ pixi_ai_tools_shared_dir }}/{{ item }}/pixi.toml"
    creates: "{{ pixi_ai_tools_shared_dir }}/{{ item }}/.pixi/envs/default/conda-meta"
  environment:
    PIXI_CACHE_DIR: "{{ pixi_ai_tools_cache_dir }}"
  loop: "{{ pixi_ai_tools_preload_tools }}"

- name: Grant the workspace group write access to the shared cache
  ansible.builtin.command:
    cmd: >-
      setfacl -R -m g:{{ pixi_ai_tools_workspace_gid }}:rwX -m d:g:{{ pixi_ai_tools_workspace_gid }}:rwX
      {{ pixi_ai_tools_cache_dir }}
  when: pixi_ai_tools_workspace_gid | length > 0
  changed_when: true
