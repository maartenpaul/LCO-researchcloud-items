---
- name: Create system-wide kernel directories
  ansible.builtin.file:
    path: "{{ pixi_ai_tools_kernel_dir }}/pixi-{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ pixi_ai_tools_preload_tools }}"

# Kernels run under ai-tools-kernel where it exists, which gives each one a
# private X display. Qt needs a display even when nothing is shown, so without
# it "napari.Viewer()" in a notebook kills the kernel with 'could not connect
# to display'. The condition is whether render.yml installed the wrapper, not
# whether the remote desktop was installed: a workspace with its own desktop
# gets the wrapper too, and one with no GUI environments gets neither.
- name: Check whether the kernel display wrapper is installed
  ansible.builtin.stat:
    path: "{{ pixi_ai_tools_kernel_wrapper }}"
  register: pixi_ai_tools_wrapper

- name: Decide whether kernels run under the display wrapper
  ansible.builtin.set_fact:
    pixi_ai_tools_kernel_prefix: >-
      {{ [pixi_ai_tools_kernel_wrapper] if pixi_ai_tools_wrapper.stat.exists else [] }}

# System-wide kernels are visible to every user at first login, with no
# per-user registration step. One kernel per tool, whose environment is picked
# when it starts, by `ai-tools run`: the user's own copy in ~/AI_tools_pixi if
# there is one — made on the spot where per-user environments are on —
# otherwise the shared one, run --frozen so it starts in seconds and never
# writes to /opt.
- name: Register system-wide Jupyter kernels for the tools
  ansible.builtin.copy:
    dest: "{{ pixi_ai_tools_kernel_dir }}/pixi-{{ item }}/kernel.json"
    mode: "0644"
    content: "{{ pixi_ai_tools_kernel_spec | to_nice_json }}\n"
  vars:
    pixi_ai_tools_kernel_spec:
      argv: >-
        {{ pixi_ai_tools_kernel_prefix + [
             '/usr/local/bin/ai-tools', 'run', item,
             'python', '-m', 'ipykernel_launcher',
             '-f', '{connection_file}'] }}
      display_name: "{{ item }} (Pixi)"
      language: python
      env:
        PIXI_CACHE_DIR: "{{ pixi_ai_tools_cache_dir }}"
  loop: "{{ pixi_ai_tools_preload_tools }}"

# Kernelspecs in a user's ~/.local/share/jupyter/kernels take precedence over
# the system ones with the same name. An earlier version of this component
# registered per-user pixi-<tool> kernels pointing at a per-user clone; left
# in place they shadow the shared kernels and each one would still kick off a
# private multi-GB install. Earlier versions of `ai-tools fork` also
# registered a pixi-<tool>-mine kernel per copy; the tool's own kernel now runs
# from the copy, so that one is a duplicate. Only the kernelspecs go — every
# copy in ~/AI_tools_pixi stays, and is what the tool's kernel now uses.
- name: Remove per-user kernelspecs left behind by earlier designs
  ansible.builtin.shell:
    cmd: |
      removed=0
      for k in /home/*/.local/share/jupyter/kernels/pixi-*; do
        [ -d "$k" ] || continue
        if grep -qE '"/home/[^/]+/AI_tools_pixi' "$k/kernel.json" 2>/dev/null; then
          rm -rf "$k"
          removed=$((removed + 1))
        fi
      done
      echo "removed=${removed}"
  register: pixi_ai_tools_stale_kernels
  changed_when: "'removed=0' not in pixi_ai_tools_stale_kernels.stdout"
