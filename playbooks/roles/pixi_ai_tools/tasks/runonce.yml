---
# ansible-galaxy lives next to the interpreter running this playbook, inside
# SRC's own venv. Calling it by bare name relies on that venv's bin being on
# PATH, which it is not whenever the playbook is started through sudo — sudo
# resets PATH to secure_path and the task fails with "No such file or
# directory: b'ansible-galaxy'". Deriving the path from the interpreter works
# in both cases.
- name: Install uusrc.general Ansible collection
  ansible.builtin.command:
    cmd: >-
      {{ ansible_playbook_python | dirname }}/ansible-galaxy
      collection install -r {{ playbook_dir }}/requirements.yml --force
  register: pixi_ai_tools_galaxy_install
  changed_when: "'Installing' in pixi_ai_tools_galaxy_install.stdout"

- name: Include uusrc.general.runonce role
  ansible.builtin.include_role:
    name: uusrc.general.runonce

- name: Deploy per-user setup script to runonce.d
  ansible.builtin.copy:
    src: setup-ai-tools.sh
    dest: "{{ pixi_ai_tools_runonce_dir }}/setup-ai-tools.sh"
    mode: "0755"
    owner: root
    group: root

- name: Set repo version in runonce environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^PIXI_AI_TOOLS_VERSION='
    line: "PIXI_AI_TOOLS_VERSION={{ pixi_ai_tools_version }}"
    create: true
    mode: "0644"
