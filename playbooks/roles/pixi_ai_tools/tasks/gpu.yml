---
# Make sure a GPU that is present can be used, before anything that depends on
# it: render.yml decides on VirtualGL from /dev/nvidiactl, and the CUDA
# environments are more at home with a driver underneath them.
#
# Normally SRC's CUDA component installs the driver. This is a fallback for when
# it is left out of the catalog item — as it had to be during the September 2026
# incident, when its unpinned `cuda-drivers` started pulling NVIDIA's 615
# open-module driver and GPU workspaces failed to start. Where nvidia-smi
# already works, none of this runs, so it never fights a working driver.
#
# Only the driver is installed, not the multi-GB CUDA toolkit: the pixi
# environments bring their own CUDA runtime and need nothing but the kernel
# module and libnvidia-compute from the host.

# Read from sysfs rather than lspci, which pciutils may not have installed.
# Vendor 0x10de is NVIDIA; class 0x03xxxx is a display or 3D controller, which
# keeps out the audio function some cards expose as a second device.
#
# The probe answers "present" or "absent" and nothing else. Anything else — an
# unreadable sysfs, a script error — fails the deploy, rather than reading as
# "no GPU" and quietly leaving a GPU workspace without a driver.
- name: Check for an NVIDIA GPU on the PCI bus
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for dev in /sys/bus/pci/devices/*; do
          [ "$(cat "$dev/vendor")" = 0x10de ] || continue
          case "$(cat "$dev/class")" in
              0x03*) echo present; exit 0 ;;
          esac
      done
      echo absent
    executable: /bin/bash
  register: pixi_ai_tools_gpu_pci
  changed_when: false
  failed_when: >-
    pixi_ai_tools_gpu_pci.rc != 0
    or pixi_ai_tools_gpu_pci.stdout not in ['present', 'absent']

- name: Check whether the NVIDIA driver is working
  ansible.builtin.command: nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
  register: pixi_ai_tools_nvidia_gpu
  changed_when: false
  failed_when: false

- name: Decide whether to install the NVIDIA driver
  ansible.builtin.set_fact:
    pixi_ai_tools_driver_valid: "{{ pixi_ai_tools_nvidia_driver | string is match('^[0-9]+$') }}"
    pixi_ai_tools_driver_install: >-
      {{ pixi_ai_tools_gpu_pci.stdout == 'present'
         and pixi_ai_tools_nvidia_gpu.rc != 0
         and pixi_ai_tools_nvidia_driver | string | lower not in ['', 'none', 'false'] }}

- name: Install the NVIDIA driver
  when: pixi_ai_tools_driver_install | bool
  block:
    - name: Refuse a driver setting that is not a branch number
      ansible.builtin.fail:
        msg: >-
          PIXI_AI_TOOLS_NVIDIA_DRIVER must be a driver branch such as "580", or
          "none" to leave the driver alone; got "{{ pixi_ai_tools_nvidia_driver }}".
      when: not pixi_ai_tools_driver_valid | bool

    - name: Refuse to install the driver on anything but Ubuntu
      ansible.builtin.fail:
        msg: >-
          An NVIDIA GPU is present without a working driver, and this component
          can only install one on Ubuntu (found {{ ansible_facts['distribution'] }}).
          Add SRC's CUDA component, or set PIXI_AI_TOOLS_NVIDIA_DRIVER=none.
      when: ansible_facts['distribution'] != 'Ubuntu'

    # DKMS builds the module against the running kernel, which needs its
    # headers. A workspace whose kernel was upgraded but not rebooted has
    # headers for the new one only, hence the exact version.
    - name: Install headers for the running kernel
      ansible.builtin.apt:
        name: "linux-headers-{{ ansible_facts['kernel'] }}"
        state: present
        update_cache: true

    - name: Add NVIDIA's CUDA apt repository
      ansible.builtin.apt:
        deb: "{{ pixi_ai_tools_cuda_keyring_url }}"

    # cuda-drivers-<branch> rather than cuda-drivers: the unpinned package
    # follows NVIDIA's newest branch, which is precisely what broke SRC's
    # component. The branch stays put across deploys; point releases within it
    # still arrive.
    - name: Install the pinned NVIDIA driver branch
      ansible.builtin.apt:
        name: "cuda-drivers-{{ pixi_ai_tools_nvidia_driver }}"
        state: present
        update_cache: true

    # A freshly installed driver works without a reboot, provided nothing else
    # (nouveau) holds the card — SRC images do not load nouveau. On later boots
    # udev loads these modules by itself.
    - name: Load the NVIDIA kernel modules
      ansible.builtin.command: modprobe -a nvidia nvidia_uvm nvidia_modeset
      changed_when: false

    # A separate register: re-registering pixi_ai_tools_nvidia_gpu here would
    # overwrite it with a "skipped" result whenever this block does not run.
    - name: Check that the driver now works
      ansible.builtin.command: nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
      register: pixi_ai_tools_nvidia_gpu_installed
      changed_when: false

- name: Report GPU status
  ansible.builtin.debug:
    msg: >-
      {% if pixi_ai_tools_driver_install | bool %}
      Installed NVIDIA driver branch {{ pixi_ai_tools_nvidia_driver }}:
      {{ pixi_ai_tools_nvidia_gpu_installed.stdout }}
      {% elif pixi_ai_tools_nvidia_gpu.rc == 0 %}
      GPU detected: {{ pixi_ai_tools_nvidia_gpu.stdout }}
      {% elif pixi_ai_tools_gpu_pci.stdout == 'present' %}
      An NVIDIA GPU is present but has no working driver, and
      PIXI_AI_TOOLS_NVIDIA_DRIVER is "{{ pixi_ai_tools_nvidia_driver }}", so none
      was installed. CUDA tools will run on the CPU.
      {% else %}
      No NVIDIA GPU detected. AI tool environments with CUDA dependencies will
      still install but GPU acceleration will not be available. Consider using a
      GPU-enabled VM flavor on Research Cloud.
      {% endif %}
