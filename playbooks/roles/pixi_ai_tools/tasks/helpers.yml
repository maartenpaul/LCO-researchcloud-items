---
# The user-facing helper scripts, installed before anything that uses them.
#
# These are deliberately not part of the desktop phase: the per-user runonce
# script calls ai-tools-has-gui to decide which desktop launchers to write, and
# that runs on workspaces where the desktop phase is switched off — an SRC
# desktop-flavour workspace already has a desktop of its own and never runs
# desktop.yml.
#
# ai-tools-kernel stays in desktop.yml: it wraps kernels in xvfb-run, which only
# that phase installs.

- name: Install the ai-tools helper for users who need to add packages
  ansible.builtin.copy:
    src: ai-tools
    dest: /usr/local/bin/ai-tools
    mode: "0755"
    owner: root
    group: root

# Read by ai-tools at every kernel start, which is why it is a file rather than
# something baked into each kernelspec: switching the mode on a redeploy
# changes it for every kernel and menu entry at once.
- name: Record whether users get their own copy of each tool
  ansible.builtin.copy:
    dest: /etc/ai-tools.conf
    mode: "0644"
    owner: root
    group: root
    content: |
      # Written by the pixi-ai-tools component (PIXI_AI_TOOLS_PER_USER_ENVS).
      PER_USER_ENVS={{ 'true' if pixi_ai_tools_per_user_envs | bool else 'false' }}

- name: Install the napari plugin probe used to decide which tools get a launcher
  ansible.builtin.copy:
    src: ai-tools-has-gui
    dest: /usr/local/bin/ai-tools-has-gui
    mode: "0755"
    owner: root
    group: root

# Both are referenced by the menu entries in launchers.yml, which are written
# whether or not this component installs a desktop.
- name: Install the GUI launcher
  ansible.builtin.copy:
    src: ai-tools-gui
    dest: /usr/local/bin/ai-tools-gui
    mode: "0755"
    owner: root
    group: root

- name: Install the JupyterLab launcher
  ansible.builtin.copy:
    src: ai-tools-lab
    dest: /usr/local/bin/ai-tools-lab
    mode: "0755"
    owner: root
    group: root
