---
# JupyterHub flavour. A user can reach Lab without ever opening a login shell,
# so runonce is run from the hub before their server starts.

- name: Install the runonce wrapper for the hub's pre-spawn hook
  ansible.builtin.copy:
    src: run-runonce.sh
    dest: /usr/local/bin/run-runonce.sh
    mode: "0755"

# Appended after SRC's own settings, so this c.Spawner.args wins. SRC limits Lab
# to a single 'src-default' kernel, which hides every pixi kernel.
- name: Add the pre-spawn hook and lift the kernel allowlist
  ansible.builtin.blockinfile:
    path: /etc/jupyterhub/jupyterhub_config.py
    marker: "# {mark} PIXI-AI-TOOLS PRE-SPAWN HOOK"
    block: |
      import os
      import subprocess

      def pre_spawn_hook(spawner):
          """Run /etc/runonce.d scripts for users who log in via JupyterHub."""
          username = spawner.user.name
          if os.path.islink(os.path.join(os.path.expanduser(f"~{username}"), "runonce.d")):
              subprocess.run(
                  ["sudo", "--set-home", "-u", username, "bash", "/usr/local/bin/run-runonce.sh"],
                  timeout=600,
              )
      c.Spawner.pre_spawn_hook = pre_spawn_hook

      c.Spawner.args = ["--KernelSpecManager.ensure_native_kernel=False"]
  notify: Restart JupyterHub
