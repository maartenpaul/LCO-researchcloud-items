---
- name: Install system dependencies
  when: ansible_pkg_mgr == 'apt'
  ansible.builtin.apt:
    name:
      - wget
      - unzip
      - libxcb-xinerama0
    state: present
    update_cache: yes
  # Apt mirror hiccups on a fresh workspace should not fail the whole build.
  failed_when: false

- name: Download and Extract QuPath
  ansible.builtin.unarchive:
    src: "{{ qupath_url }}"
    dest: "/opt"
    remote_src: yes
    creates: "/opt/QuPath/bin/QuPath"

- name: Create Common Data directory
  ansible.builtin.file:
    path: "{{ qupath_common_data_dir }}"
    state: directory
    mode: '0777'

- name: Download Extensions from Zenodo
  ansible.builtin.unarchive:
    src: "{{ qupath_common_data_url }}"
    dest: "{{ qupath_common_data_dir }}"
    remote_src: yes

- name: Configure QuPath preferences
  ansible.builtin.shell: |
    export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
    /opt/QuPath/bin/QuPath script "{{ role_path }}/files/QuPath_setPaths.groovy"
  # This targets the researcher user (e.g., ubuntu)
  become: yes
  become_user: "{{ ansible_user_id }}"
  # Writes the preferences file every run; a headless QuPath that exits
  # non-zero should not fail the workspace build.
  changed_when: true
  failed_when: false

- name: Install Desktop Launcher
  ansible.builtin.template:
    src: qupath.desktop.j2
    dest: "/usr/share/applications/qupath.desktop"
    mode: "0644"
