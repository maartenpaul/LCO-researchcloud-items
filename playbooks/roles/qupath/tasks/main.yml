---
- name: Install system dependencies
  ansible.builtin.apt:
    name: [unzip, xz-utils, libxcb-xinerama0]
    state: present
    update_cache: true

- name: Download and unpack QuPath
  ansible.builtin.unarchive:
    src: "{{ qupath_url }}"
    dest: /opt
    remote_src: true
    creates: /opt/QuPath/bin/QuPath

# Writable by everyone, so an extension installed from QuPath's catalog lands
# here for all users.
- name: Create the common data directory
  ansible.builtin.file:
    path: "{{ qupath_common_data_dir }}"
    state: directory
    mode: "0777"

- name: Download and unpack the common data
  ansible.builtin.unarchive:
    src: "{{ qupath_common_data_url }}"
    dest: "{{ qupath_common_data_dir }}"
    remote_src: true
    creates: "{{ qupath_common_data_dir }}/extensions/catalogs/registry.json"

- name: Add QuPath to the application menu
  ansible.builtin.template:
    src: qupath.desktop.j2
    dest: /usr/share/applications/qupath.desktop
    mode: "0644"

- name: Install the preferences script
  ansible.builtin.template:
    src: qupath-prefs.groovy.j2
    dest: /opt/QuPath/qupath-prefs.groovy
    mode: "0644"

- name: Install uusrc.general Ansible collection
  ansible.builtin.command:
    cmd: >-
      {{ ansible_playbook_python | dirname }}/ansible-galaxy
      collection install -r {{ playbook_dir }}/requirements.yml --force
  register: qupath_galaxy
  changed_when: "'Installing' in qupath_galaxy.stdout"

- name: Include uusrc.general.runonce role
  ansible.builtin.include_role:
    name: uusrc.general.runonce

- name: Install the per-user QuPath setup
  ansible.builtin.copy:
    src: setup-qupath.sh
    dest: /etc/runonce.d/setup-qupath.sh
    mode: "0755"
