---
qupath_version: "0.6.0"
qupath_url: >-
  https://github.com/qupath/qupath/releases/download/v{{ qupath_version }}/QuPath-v{{ qupath_version }}-Linux.tar.xz
# Extensions (cellpose, StarDist, InstanSeg, OMERO, ...) and models, as used by
# BIOP-desktop's Dockerfile-qupath.
qupath_common_data_url: "https://zenodo.org/records/17121500/files/QuPath_Common_Data_0.6.zip?download=1"
qupath_common_data_dir: /opt/QuPath_Common_Data
# Where the pixi_ai_tools role builds its environments; the cellpose extension
# is pointed at the cellpose one when it exists.
qupath_pixi_envs_dir: /opt/AI_tools_pixi
