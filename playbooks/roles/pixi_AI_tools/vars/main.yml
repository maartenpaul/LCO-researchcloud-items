---
pixi_version: "latest"
pixi_install_url: "https://pixi.sh/install.sh"
# Install in user's home directory for easy editing
user_home: "{{ ansible_env.HOME }}"
pixi_home: "{{ user_home }}/.pixi"
pixi_bin: "{{ user_home }}/.pixi/bin/pixi"

# GitHub repository details
ai_tools_repo: "https://github.com/Leiden-Cell-Observatory/AI_tools_pixi.git"
ai_tools_dir: "{{ user_home }}/AI_tools_pixi"

# List of pixi environments to install (folder names from the repo)
pixi_environments:
  - biapy
  - CAREamics
  - cellpose
  - micro_sam
  - omero
  - spotiflow
  - trackastra
