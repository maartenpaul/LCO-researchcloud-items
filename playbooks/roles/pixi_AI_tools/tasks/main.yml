---
- name: Install system dependencies
  when: ansible_pkg_mgr == 'apt'
  ansible.builtin.apt:
    name:
      - curl
      - git
      - build-essential
    state: present
    update_cache: true
  ignore_errors: yes # Bypasses the mirror errors seen in your screenshot


- name: Check if pixi is already installed
  ansible.builtin.stat:
    path: "{{ pixi_bin }}"
  register: pixi_binary

- name: Download and install pixi
  ansible.builtin.shell: |
    curl -fsSL {{ pixi_install_url }} | bash
  args:
    creates: "{{ pixi_bin }}"
  environment:
    PIXI_HOME: "{{ pixi_home }}"
  when: not pixi_binary.stat.exists

- name: Ensure pixi home directory exists
  ansible.builtin.file:
    path: "{{ pixi_home }}/bin"
    state: directory
    mode: '0755'

- name: Ensure pixi binary is in PATH
  ansible.builtin.lineinfile:
    path: /etc/profile.d/pixi.sh
    line: 'export PATH="{{ pixi_home }}/bin:$PATH"'
    create: yes
    mode: '0644'

- name: Clone AI_tools_pixi repository
  ansible.builtin.git:
    repo: "{{ ai_tools_repo }}"
    dest: "{{ ai_tools_dir }}"
    version: master
    force: yes

- name: Set permissions on AI_tools_pixi directory
  ansible.builtin.file:
    path: "{{ ai_tools_dir }}"
    state: directory
    mode: '0755'
    recurse: yes

- name: Install pixi environments
  ansible.builtin.shell: |
    {{ pixi_bin }} install
  args:
    chdir: "{{ ai_tools_dir }}/{{ item }}"
    creates: "{{ ai_tools_dir }}/{{ item }}/.pixi"
  loop: "{{ pixi_environments }}"
  register: pixi_install_result
  failed_when: pixi_install_result.rc != 0

- name: Create desktop entries directory
  ansible.builtin.file:
    path: /usr/share/applications
    state: directory
    mode: '0755'

- name: Create desktop launcher for pixi environments
  ansible.builtin.template:
    src: pixi_environment.desktop.j2
    dest: "/usr/share/applications/pixi_{{ item }}.desktop"
    mode: "0644"
  loop: "{{ pixi_environments }}"

- name: Display installation summary
  ansible.builtin.debug:
    msg: |
      Pixi has been installed successfully!
      Installed environments: {{ pixi_environments | join(', ') }}
      Location: {{ ai_tools_dir }}
      
      To use an environment, run:
      cd {{ ai_tools_dir }}/<environment_name>
      pixi shell
