---
- name: Install system dependencies
  when: ansible_pkg_mgr == 'apt'
  ansible.builtin.apt:
    name:
      - curl
      - git
      - build-essential
    state: present
    update_cache: true
  become: yes
  ignore_errors: yes # Bypasses the mirror errors seen in your screenshot


- name: Check if pixi is already installed
  ansible.builtin.stat:
    path: "{{ pixi_bin }}"
  register: pixi_binary
  become: no

- name: Download and install pixi (as user)
  ansible.builtin.shell: |
    curl -fsSL {{ pixi_install_url }} | bash
  args:
    creates: "{{ pixi_bin }}"
  when: not pixi_binary.stat.exists
  become: no

- name: Add pixi to user's shell profile
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.bashrc"
    line: 'export PATH="{{ pixi_home }}/bin:$PATH"'
    create: yes
    mode: '0644'
  become: no

- name: Clone AI_tools_pixi repository (as user)
  ansible.builtin.git:
    repo: "{{ ai_tools_repo }}"
    dest: "{{ ai_tools_dir }}"
    version: master
    force: yes
  become: no

- name: Install pixi environments
  ansible.builtin.shell: |
    {{ pixi_bin }} install
  args:
    chdir: "{{ ai_tools_dir }}/{{ item }}"
    creates: "{{ ai_tools_dir }}/{{ item }}/.pixi"
  loop: "{{ pixi_environments }}" (as user)
  ansible.builtin.shell: |
    {{ pixi_bin }} install
  args:
    chdir: "{{ user desktop entries directory
  ansible.builtin.file:
    path: "{{ user_home }}/.local/share/applications"
    state: directory
    mode: '0755'
  become: no

- name: Create desktop launcher for pixi environments
  ansible.builtin.template:
    src: pixi_environment.desktop.j2
    dest: "{{ user_home }}/.local/share/applications/pixi_{{ item }}.desktop"
    mode: "0644"
  loop: "{{ pixi_environments }}"
  become: no
  loop: "{{ pixi_environments }}"

- name: Display installation summary
  ansible.builtin.debug:
    msg: |
      Pixi has been installed successfully!
      Installed environments: {{ pixi_environments | join(', ') }}
      Location: {{ ai_tools_dir }}
      
      To use an environment, run:
      cd {{ ai_tools_dir }}/<environment_name>
      pixi shell
