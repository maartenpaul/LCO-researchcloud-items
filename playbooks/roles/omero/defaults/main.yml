---
# SRC parameters. A component parameter reaches an Ansible playbook as a
# variable named after its key — not as an environment variable, which is the
# PowerShell/Windows mechanism. Reading these with lookup('env', ...) alone
# would silently ignore everything set in the portal and always use the
# defaults below. The env lookup is kept only as a fallback so the role can be
# driven from a shell when testing outside SRC.

# Base path for bind-mounted OMERO data. SRC mounts attached storage at
# /data/<storage-name>, so the value depends on the workspace — mark this
# parameter Required in the component and SRC will ask the workspace-user for
# it at creation time, when the name is known. Subdirectories "postgres" and
# "omero" are created underneath. Empty falls back to Docker named volumes on
# the system disk, which is fine for a scratch workspace but will fill the root
# disk on a real one.
omero_data_path: "{{ OMERO_DATA_PATH | default(lookup('env', 'OMERO_DATA_PATH'), true) | default('', true) }}"

# Password for the OMERO "root" account. Empty → a random password is
# generated at deploy time and stored in /opt/omero/credentials (read with
# sudo). Only applied when OMERO.server initializes a fresh database, so
# it stays stable on redeploys.
omero_root_password: >-
  {{ OMERO_ROOT_PASSWORD | default(lookup('env', 'OMERO_ROOT_PASSWORD'), true)
     | default('', true) }}

# When true, the workspace URL (port 443) requires an SRAM login before
# traffic reaches OMERO's own login page. When false, port 443 proxies
# straight to OMERO.
omero_require_sram_auth: >-
  {{ OMERO_REQUIRE_SRAM_AUTH | default(lookup('env', 'OMERO_REQUIRE_SRAM_AUTH'), true)
     | default('true', true) }}

# When true, an additional nginx server block exposes OMERO over HTTPS on
# omero_direct_port, reusing the workspace certificate, without SRAM auth.
omero_direct_access: >-
  {{ OMERO_DIRECT_ACCESS | default(lookup('env', 'OMERO_DIRECT_ACCESS'), true)
     | default('false', true) }}
omero_direct_port: "{{ OMERO_DIRECT_PORT | default(lookup('env', 'OMERO_DIRECT_PORT'), true) | default('8443', true) }}"

# Extra origins to add to Django's CSRF allow-list, comma-separated and with
# the scheme included (e.g. "https://omero.example.org"). The workspace URL —
# and the direct endpoint when enabled — are always trusted; this is only for
# additional names such as a CNAME pointing at the workspace.
omero_extra_csrf_origins: >-
  {{ OMERO_EXTRA_CSRF_ORIGINS | default(lookup('env', 'OMERO_EXTRA_CSRF_ORIGINS'), true)
     | default('', true) }}

# Container image tags ("5" tracks the latest OMERO 5 release).
omero_image_tag: "{{ OMERO_IMAGE_TAG | default(lookup('env', 'OMERO_IMAGE_TAG'), true) | default('5', true) }}"
omero_postgres_tag: >-
  {{ OMERO_POSTGRES_TAG | default(lookup('env', 'OMERO_POSTGRES_TAG'), true)
     | default('16', true) }}

# Internal defaults — normally not changed.
omero_web_port: 4080
omero_project_dir: /opt/omero

# OMERO.figure exports figures as PDF or TIFF through a server-side script that
# ships with the omero-figure package but is not installed into OMERO.server by
# it, so a stock server answers the export with "Figure_To_Pdf.py not found".
# Keep the version in step with the omero-figure in the omero-web image
# (omero-web-standalone:5 currently carries 7.4.1); the script and the plugin
# exchange a figure JSON whose fields move between releases.
omero_figure_version: 7.4.1
omero_figure_script: "{{ omero_project_dir }}/Figure_To_Pdf.py"
omero_figure_script_url: >-
  https://raw.githubusercontent.com/ome/omero-figure/v{{ omero_figure_version
  }}/omero_figure/scripts/omero/figure_scripts/Figure_To_Pdf.py
omero_nginx_location_conf: /etc/nginx/app-location-conf.d/omero.conf
omero_nginx_direct_conf: /etc/nginx/conf.d/omero-direct.conf

# SRC provides workspace_fqdn as an extra var at component runtime; fall back
# to the env var, then to the host FQDN (which is correct on SRC workspaces).
omero_workspace_fqdn: "{{ workspace_fqdn | default(lookup('env', 'WORKSPACE_FQDN')) | default(ansible_fqdn, true) }}"

# Origins Django accepts for its CSRF check. OMERO.web sits behind the nginx
# reverse proxy and only ever sees plain HTTP on localhost, so the https
# workspace URL has to be trusted explicitly — otherwise every POST, including
# the login form, is rejected with "CSRF Failed: Origin checking failed". The
# direct endpoint carries its port in the browser's Origin header, so it needs
# an entry of its own. Kept as a list; the template serialises it to JSON,
# because a JSON string here would be turned straight back into a list by
# Ansible's native type coercion and then render as Python repr.
omero_csrf_trusted_origins: >-
  {{ ['https://' ~ omero_workspace_fqdn]
     + (['https://' ~ omero_workspace_fqdn ~ ':' ~ omero_direct_port]
        if omero_direct_access | bool else [])
     + (omero_extra_csrf_origins.split(',') | map('trim') | select | list) }}

# Volume source per service: bind path when omero_data_path is set,
# otherwise the Docker named volume.
omero_database_volume: "{{ omero_data_path ~ '/postgres' if omero_data_path else 'database' }}"
omero_server_volume: "{{ omero_data_path ~ '/omero' if omero_data_path else 'omero' }}"
