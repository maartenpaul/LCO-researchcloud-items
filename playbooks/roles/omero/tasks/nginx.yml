---
- name: Deploy the OMERO location block on the SRC HTTPS server
  ansible.builtin.template:
    src: omero-location.conf.j2
    dest: "{{ omero_nginx_location_conf }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Deploy the direct-access server block
  ansible.builtin.template:
    src: omero-direct.conf.j2
    dest: "{{ omero_nginx_direct_conf }}"
    owner: root
    group: root
    mode: "0644"
  when: omero_direct_access | bool
  notify: Reload nginx

- name: Remove the direct-access server block when disabled
  ansible.builtin.file:
    path: "{{ omero_nginx_direct_conf }}"
    state: absent
  when: not (omero_direct_access | bool)
  notify: Reload nginx

# Ports 4063/4064 (and omero_direct_port) are opened in the workspace security
# group through the SRC dashboard, not from this component.
