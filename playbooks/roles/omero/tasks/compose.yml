---
- name: Create the OMERO project directory
  ansible.builtin.file:
    path: "{{ omero_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# The password lookup would write its store on the Ansible controller as the
# invoking user (lookups ignore "become"), which fails on the root-owned
# project directory. Read and write the store with modules instead so the
# generated password survives redeploys regardless of who runs the playbook.
- name: Look for a previously generated root password
  ansible.builtin.stat:
    path: "{{ omero_project_dir }}/.root_password"
  register: omero_root_password_store
  when: not omero_root_password

- name: Read the previously generated root password
  ansible.builtin.slurp:
    src: "{{ omero_project_dir }}/.root_password"
  register: omero_root_password_slurp
  when:
    - not omero_root_password
    - omero_root_password_store.stat.exists | default(false)

- name: Reuse the previously generated root password
  ansible.builtin.set_fact:
    omero_root_password: "{{ omero_root_password_slurp.content | b64decode | trim }}"
    omero_root_password_generated: true
  when:
    - not omero_root_password
    - omero_root_password_store.stat.exists | default(false)

# The parameters have to travel in the term string: the password lookup only
# accepts them as keyword arguments from ansible-core 2.11 onwards, and
# silently falls back to its defaults (which include punctuation) on older
# versions such as the ansible 2.10 shipped with Ubuntu 22.04.
- name: Generate a random root password when none was provided
  ansible.builtin.set_fact:
    omero_root_password: >-
      {{ lookup('ansible.builtin.password',
         '/dev/null length=20 chars=ascii_letters,digits') | trim }}
    omero_root_password_generated: true
    omero_root_password_new: true
  when: not omero_root_password

- name: Store the generated root password
  ansible.builtin.copy:
    dest: "{{ omero_project_dir }}/.root_password"
    content: "{{ omero_root_password }}"
    owner: root
    group: root
    mode: "0600"
  when: omero_root_password_new | default(false)

- name: Write a human-readable credentials file
  ansible.builtin.copy:
    dest: "{{ omero_project_dir }}/credentials"
    content: |
      OMERO administrator credentials
      ===============================
      User:     root
      Password: {{ omero_root_password }}

      Generated at deploy time because OMERO_ROOT_PASSWORD was not set.
      OMERO.server only consumes this password while initializing a fresh
      database — editing this file does NOT change the OMERO password.
    owner: root
    group: root
    mode: "0600"
  when: omero_root_password_generated | default(false)

# Bind-mounted into the server container rather than baked into an image, so
# the stock openmicroscopy/omero-server image can still be used as-is. That
# image already provides the reportlab, Markdown and Pillow the script imports,
# so nothing has to be installed alongside it.
- name: Install the OMERO.figure PDF export script
  ansible.builtin.get_url:
    url: "{{ omero_figure_script_url }}"
    dest: "{{ omero_figure_script }}"
    owner: root
    group: root
    mode: "0644"
  register: omero_figure_script_download

# Docker binds a single-file mount to the inode the file had when the container
# started, and get_url replaces the file rather than rewriting it. A container
# that is already up therefore keeps serving the old script, so note here
# whether one exists before the compose run below either creates it (mount
# already current) or leaves it running (mount now stale).
- name: Check whether an OMERO.server container already exists
  ansible.builtin.command: "{{ omero_compose_cmd }} ps -q omeroserver"
  register: omero_server_existing
  changed_when: false
  failed_when: false
  args:
    chdir: "{{ omero_project_dir }}"

- name: Deploy the docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ omero_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Pull the OMERO container images
  ansible.builtin.command: "{{ omero_compose_cmd }} pull"
  register: omero_compose_pull
  changed_when: false
  failed_when: omero_compose_pull.rc != 0
  args:
    chdir: "{{ omero_project_dir }}"

- name: Start the OMERO stack
  ansible.builtin.command: "{{ omero_compose_cmd }} up -d"
  register: omero_compose_up
  changed_when: "'Created' in omero_compose_up.stderr or 'Started' in omero_compose_up.stderr"
  failed_when: omero_compose_up.rc != 0
  args:
    chdir: "{{ omero_project_dir }}"

- name: Recreate OMERO.server when the export script changed under it
  ansible.builtin.command: "{{ omero_compose_cmd }} up -d --force-recreate omeroserver"
  register: omero_server_recreate
  changed_when: true
  failed_when: omero_server_recreate.rc != 0
  args:
    chdir: "{{ omero_project_dir }}"
  when:
    - omero_figure_script_download is changed
    - omero_server_existing.stdout | trim | length > 0

- name: Wait for OMERO.web to respond (first start initializes the database)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ omero_web_port }}"
    status_code: [200, 301, 302]
  register: omero_web_response
  retries: 30
  delay: 10
  until: omero_web_response.status is defined and omero_web_response.status in [200, 301, 302]
