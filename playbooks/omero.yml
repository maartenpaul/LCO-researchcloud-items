---
# omero.yml — SURF Research Cloud component entry point.
#
# Deploys OMERO.server + OMERO.web with Docker (based on
# https://github.com/ome/docker-example-omero) behind the SRC nginx
# reverse proxy, with optional SRAM authentication and an optional
# direct HTTPS endpoint. All logic lives in roles/omero; see its README.
#
# SRC Parameters. Declared in the component wizard; SRC passes each one to this
# playbook as an Ansible variable named after its key. The role also accepts the
# same names as environment variables, which is only meant for testing outside
# SRC.
#   OMERO_DATA_PATH          — bind-mount base for data. SRC mounts attached
#                              storage at /data/<storage-name>, so mark this
#                              parameter Required and let SRC ask the
#                              workspace-user at creation time
#                              (default: empty → Docker named volumes)
#   OMERO_ROOT_PASSWORD      — OMERO root password, first boot only
#                              (default: generated random password stored
#                              in /opt/omero/credentials)
#   OMERO_REQUIRE_SRAM_AUTH  — require SRAM login on port 443
#                              (default: "true")
#   OMERO_DIRECT_ACCESS      — extra HTTPS endpoint without SRAM auth
#                              (default: "false")
#   OMERO_DIRECT_PORT        — port for the direct endpoint (default: "8443")
#   OMERO_EXTRA_CSRF_ORIGINS — extra origins to trust for Django's CSRF check,
#                              comma-separated, scheme included. The workspace
#                              URL and the direct endpoint are always trusted.
#   OMERO_IMAGE_TAG          — OMERO image tag (default: "5")
#   OMERO_POSTGRES_TAG       — PostgreSQL image tag (default: "16")

- name: Deploy OMERO
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  roles:
    - omero
